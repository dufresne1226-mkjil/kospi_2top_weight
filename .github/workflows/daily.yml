name: 일일 시총비중 갱신

on:
  schedule:
    # GitHub Actions cron은 정시 보장이 안 되고 부하 시 스킵/지연됨.
    # 하지만 build.py 는 인자 없이 실행하면 '마지막 기록일~오늘'의 빠진 날을
    # 전부 채우는 catch-up 을 한다. 그래서 하루가 통째로 밀려도 다음 실행에서
    # 자동 복구되므로, 하루 2회만 돌려도 충분하다(16:42 / 18:05 KST).
    - cron: "42 7 * * 1-5"
    - cron: "5 9 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오늘 종가 적재 (경량)
        run: python3 build.py

      - name: 데이터·차트 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          if git diff --cached --quiet; then
            echo "변경 없음 (휴장 또는 이미 적재됨)"
          else
            git commit -m "daily: $(TZ=Asia/Seoul date +%Y-%m-%d) 시총비중 갱신 [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
