name: 일일 시총비중 갱신

on:
  schedule:
    # 평일 16:42 KST = 07:42 UTC. 네이버 종가 확정(16:30) 이후.
    - cron: "42 7 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    # 워크플로우가 데이터·페이지를 커밋하면서 자기 자신을 다시 트리거하지 않도록
    # data/** 와 docs/** 변경은 무시. 스크립트·워크플로우 손수 수정만 재빌드.
    paths-ignore:
      - "data/**"
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오늘 종가 적재 (경량)
        run: python3 build.py

      - name: 데이터·차트 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          if git diff --cached --quiet; then
            echo "변경 없음 (휴장 또는 이미 적재됨)"
          else
            git commit -m "daily: $(TZ=Asia/Seoul date +%Y-%m-%d) 시총비중 갱신"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
